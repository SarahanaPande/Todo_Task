{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add_Task</title>
    <link rel="stylesheet" href="{% static "css/add_task.css" %}">
</head>
<body>
    <div class = "add_task_bar">
        {% include "navbar.html" %}
        <div class="add_task_box">
            <h1>Edit Task</h1>

            <form action="{% url "edit_task" task_data.id %}" method = "post">
                {% csrf_token %}
                <label for="title">Title</label><br>
                <input type="text" name="title" id ="title" value = {{ task_data.Title }}><br><br>
                <label for="description">Decription</label><br>
                <textarea name="description" id="description" >{{ task_data.Description }}</textarea>
                <div class = "btn_box">
                    <button class = "save">Update</button>
                    <button class = "cancel">cancel</button>
                </div>
            </form>
        </div>
     </div>

</body>
</html>
